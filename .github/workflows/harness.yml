name: CI / backend harness
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract check dependencies
        run: python -m pip install -r backend/harness/requirements-check.txt
      - name: Check backend contracts and repository links
        run: python backend/harness/scripts/check.py
