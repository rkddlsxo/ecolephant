name: CI / backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docs/api/**'
      - 'harness/fixtures/policy/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'docs/api/**'
      - 'harness/fixtures/policy/**'
      - '.github/workflows/ci-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend
      - run: python -m compileall -q backend/ecolephant backend/lambda_handler.py
