name: CI / frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'ai/**'
      - 'docs/api/**'
      - 'package*.json'
      - 'eslint.config.mjs'
      - 'scripts/contracts.mjs'
      - 'scripts/check-build-secrets.mjs'
      - 'scripts/setup*.mjs'
      - 'scripts/runtime.mjs'
      - 'backend/.env.example'
      - 'backend/requirements-lock.txt'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'ai/**'
      - 'docs/api/**'
      - 'package*.json'
      - 'eslint.config.mjs'
      - 'scripts/contracts.mjs'
      - 'scripts/check-build-secrets.mjs'
      - 'scripts/setup*.mjs'
      - 'scripts/runtime.mjs'
      - 'backend/.env.example'
      - 'backend/requirements-lock.txt'
      - '.github/workflows/ci-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install -c backend/requirements-lock.txt python-dotenv
      - run: node --test scripts/setup-env.test.mjs
        env:
          ECOLEPHANT_SETUP_TEST_PYTHON: python
      - run: npm run contracts:check
      - run: npm run lint
      - run: npm run test:run --workspace frontend
      - run: npm run build
      - run: node scripts/check-build-secrets.mjs
