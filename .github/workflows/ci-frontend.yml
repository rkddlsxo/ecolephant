name: CI / frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'ai/**'
      - 'docs/api/**'
      - 'package*.json'
      - 'eslint.config.mjs'
      - 'scripts/contracts.mjs'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'ai/**'
      - 'docs/api/**'
      - 'package*.json'
      - 'eslint.config.mjs'
      - 'scripts/contracts.mjs'
      - '.github/workflows/ci-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run contracts:check
      - run: npm run lint
      - run: npm run build
