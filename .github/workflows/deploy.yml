name: CD / deploy

#pr을 올렸을 때는 검증만 돌고, main브랜치에 머지되었을 때는 검증 통과 후 실제 배포(deploy)까지 이어지도록 트리거를 나눕니다.
on:
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - 'infra/ansible/**'
      - 'deploy/**'
      - 'compose*.yml'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'infra/terraform/**'
      - 'infra/ansible/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

#github actions가 aws oidc에 제출할 일회용 신분증 (JWT토큰)을 발급받기 위해 반드시 필요한 권한
permissions:
  contents: read
  id-token: write

#aws 자격증명 없이 지금 짠 terraform코드에 문법 오타가 없는지 검사
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      # terraform init -backend=false로 aws계정이 없는 phase1 상태에서도 terraform 포맷, 문법을 자동검사
      - name: Check Terraform formatting
        if: hashFiles('infra/terraform/**/*.tf') != ''
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate Terraform OIDC module
        if: hashFiles('infra/terraform/oidc/*.tf') != ''
        working-directory: infra/terraform/oidc
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate Terraform main infrastructure module
        if: hashFiles('infra/terraform/main/*.tf') != ''
        working-directory: infra/terraform/main
        run: |
          terraform init -backend=false
          terraform validate

      #ansible플레이북 yaml문법도 자동으로 검사한다.
      #if: github.event_name == 'pull_request' && vars.AWS_ROLE_ARN != '': 나중에 AWS 계정이 나와서 GitHub Variables에 AWS_ROLE_ARN을 등록하면,
      #PR에서 자동으로 terraform plan까지 돌려 변경점(diff)을 보여줍니다. (지금은 변수가 비어 있으니 에러 없이 건너뜁니다!)
      - name: Validate Ansible playbook syntax
        if: hashFiles('infra/ansible/playbook.yml') != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible
          ansible-playbook --syntax-check -i "localhost," infra/ansible/playbook.yml

      - name: Configure AWS credentials via OIDC for PR plan
        if: github.event_name == 'pull_request' && vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}

      - name: Run Terraform plan on pull request
        if: github.event_name == 'pull_request' && vars.AWS_ROLE_ARN != ''
        working-directory: infra/terraform/main
        run: |
          terraform init
          terraform plan -no-color

  # environment: production: GitHub의 production 환경 승인 게이트를 통과해야만 실행됩니다.
  # 일반설정은 모두 vars.*(github variables)에서 읽고, 민감정보인 ssh 개인키만 (github secrets)에서 읽어 ansible 무중단 배포를 실행한 뒤 키 파일을 즉시 삭제 합니다.
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
# 장기 aws 액세스 키 없이 vars.AWS_ROLE_ARN을 통해 1시간짜리 임시 자격증명을 OIDC로 발급받아 로그인
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}

      - name: Apply Terraform infrastructure
        working-directory: infra/terraform/main
        run: |
          terraform init
          terraform apply -auto-approve

    # ssh 개인키 권한을 0600으로 잠그고, ansible 무중단 배포(run_deploy=true) 실행 직후 키 파일을 즉시 삭제해 보안 유지
    # 주의: GitHub Actions 문법상 step의 if 조건문 안에는 secrets.* 를 직접 쓸 수 없으므로(Invalid workflow file 에러 발생),
    # env로 주입한 뒤 셸 스크립트 안에서 비어있는지 검사합니다.
      - name: Provision EC2 and execute zero-downtime rolling update via Ansible
        if: vars.EC2_HOST != ''
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER || 'ubuntu' }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$EC2_SSH_KEY" ]; then
            echo "EC2_SSH_KEY secret is not configured; skipping Ansible deployment."
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y ansible
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 0600 ~/.ssh/deploy_key
          ansible-playbook \
            -i "${EC2_HOST}," \
            -u "${EC2_USER}" \
            --private-key ~/.ssh/deploy_key \
            -e "run_deploy=true" \
            infra/ansible/playbook.yml
          rm -f ~/.ssh/deploy_key
