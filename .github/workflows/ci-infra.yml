name: CI / infra

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'scripts/lambda-package*'
      - 'scripts/package-lambda.mjs'
      - '.github/workflows/ci-infra.yml'
  pull_request:
    paths:
      - 'infra/**'
      - 'scripts/lambda-package*'
      - 'scripts/package-lambda.mjs'
      - '.github/workflows/ci-infra.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q infra
      - run: pip install -r infra/requirements.txt
      - run: python -m unittest discover -s infra/tests -p 'test_*.py'
      - run: node --test scripts/lambda-package.test.mjs
