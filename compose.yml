services:
  dynamodb:
    image: amazon/dynamodb-local:2.6.1
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
  init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    entrypoint: ["python", "/tools/init-dynamodb.py"]
    environment:
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000
      ECOLEPHANT_TABLE: ecolephant-local
    volumes:
      - ./scripts/init-dynamodb.py:/tools/init-dynamodb.py:ro
    depends_on:
      - dynamodb
    restart: on-failure
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      ECOLEPHANT_STORAGE: dynamodb
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000
      AWS_DEFAULT_REGION: ap-northeast-2
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      init:
        condition: service_completed_successfully
volumes:
  dynamodb-data:
