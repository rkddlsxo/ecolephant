services:
  dynamodb:
    image: amazon/dynamodb-local:2.6.1
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data -disableTelemetry
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
  init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    entrypoint: ["python", "/tools/init-dynamodb.py"]
    environment:
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000
      ECOLEPHANT_TABLE: ecolephant-local
    volumes:
      - ./scripts/init-dynamodb.py:/tools/init-dynamodb.py:ro
    depends_on:
      - dynamodb
    restart: on-failure
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      ECOLEPHANT_STORAGE: dynamodb
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000
      AWS_DEFAULT_REGION: ap-northeast-2
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      //호스트의 5000번 포트를 직접열면, 컨테이너 2개가 동시에 5000번을 잡으려다 충돌합니다.
      //expose로 도커 내부망에만 5000번을 열고 컨테이너를 2개 (replicas: 2) 띄웁니다.
    expose:
      - "5000"
    deploy:
      replicas: 2

    //컨테이너를 끌 때, 즉시 강제 종료하지 않고, sigterm 신호를 보낸 뒤 처리중이던
    //API요청을 끝낼 시간을 최대 15초 동안 기다려줍니다.
    stop_grace_period: 15s
    // 5초마다 파이썬으로 http://127.0.0.1:5000/health를 찔러서, 프로세스만 켜진게 아니라
    // 실제로 Flask가 200응답을 줄 수 있는지 검사합니다.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    // backend가 단순히 시작된게 아니라 위 healthcheck를 통과한 뒤에야 nginx를 켭니다.
    depends_on:
      init:
        condition: service_completed_successfully
  web:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
volumes:
  dynamodb-data:
