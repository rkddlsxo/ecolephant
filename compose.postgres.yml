# PostgreSQL 16 로컬 컨테이너 및 스키마 초기화 구성
# 기동 순서: 1순위 postgres
#         -> 2순위 init-postgres
#         -> 3순위 backend
services:
  postgres:
  #초경량버전, 일반버전보다 용량과 메모리를 훨씬 적게 먹어서, 나중에 서버에 올릴 때 메모리가 안터지게 해줌
    image: postgres:16-alpine
    environment:
    # 환경변수로 따로 지정한 값이 있으면 그걸 쓰고, 없으면 기본값을 쓴다. (안그러면 매번 바꿔줘야 해서 귀찮음)
      POSTGRES_DB: ${POSTGRES_DB:-ecolephant}
      POSTGRES_USER: ${POSTGRES_USER:-ecolephant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecolephant_local}
    ports:
      # 외부 인터넷에서 DB 포트로 직접 들어오지 못하도록 로컬호스트(127.0.0.1)에만 바인딩합니다.
      # 그냥 5432:5432라고 적으면 외부 인터넷(0.0.0.0)에 누구나 우리 DB포트를 찔러 볼 수 있다.
      # 앞에 127.0.0.1: 를 붙이면 로컬PC에서만 접속가능해서 더 안전함.
      - "127.0.0.1:5432:5432"
      #컨테이너를 껏다켜도 db안에 저장한 세션 기록이 날아가지 않게 하드디스크(postgres-data)에 영구 보관하는 설정
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # 프로세스만 켜진 상태가 아니라 실제로 SQL 쿼리를 받을 준비가 끝났는지 pg_isready로 확인합니다.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ecolephant} -d $${POSTGRES_DB:-ecolephant}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

# 이 컨테이너는 계속 켜져있는 서버가 아니라, 파이썬으로 스크립트를 딱 한 번 실행해서 아까 만든 표 5개를 db에 만들어주고 즉시 종료(퇴근)하는 일회용 작업자
  init-postgres:
    build:
      context: .
      dockerfile: backend/Dockerfile
    entrypoint: ["python", "/tools/init-postgres.py"]
    environment:
      ECOLEPHANT_POSTGRES_DSN: postgresql://ecolephant:ecolephant_local@postgres:5432/ecolephant
    volumes:
    # ro: 컨테이너 안에서 실수로 원본 파이썬 파일이나 SQL파일을 수정하거나 지우지 못하게 읽기 전용으로만 넣어주는 안전장치
      - ./scripts/init-postgres.py:/tools/init-postgres.py:ro
      - ./backend/ecolephant/sql/schema.sql:/tools/schema.sql:ro
    depends_on:
      postgres:
        # postgres 컨테이너가 pg_isready 헬스체크를 통과(service_healthy)한 뒤에야 테이블 생성을 시작합니다.
        # 1번 postgres 컨테이너가 위에서 pg_isready 검사를 통과해 healthy 도장을 받은 직후에만 이 선반 설치 기사님이 출근하도록 순서를 강제한 줄
        condition: service_healthy
    restart: on-failure

volumes:
  postgres-data:

