#기본 대상 서버 목록 파일과 ubuntu ec2 기본 접속 계정을 지정합니다.
[defaults]
inventory = inventory.ini
remote_user = ubuntu
#CI/CD(github actions)에서 새로 만든 ec2에 처음 ssh접속할 때
#"are you sure you want to continue connecting (yes/no)?" 질문에 멈추지 않도록 하고,
#실패 시 불필요한 .retry 파일이 생기지 않게 합니다.
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent

#작업(task)마다 매번 ssh연결을 새로 맺지 않고 하나의 ssh연결을 60초간 재사용해
#ansible 실행 속도를 2~3배 빠르게 만듭니다.
[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
