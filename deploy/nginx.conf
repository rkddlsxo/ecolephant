# docker compose 내부 dns가 backend라는 이름에 연결된 모든 컨테이너의 ip를 알려준다.
upstream backend_servers {
    # 특정 컨테이너가 5초안에 2번 응답에 실패하면, nginx는 그 컨테이너가 죽었다고 판단하고 잠시 목록에서 빼버린다.
    server backend:5000 max_fails=2 fail_timeout=5s;
    # nginx와 백엔드 사이에 매번 tcp 연결을 새로 맺지 않도록 최대 16개의 연결을 열어두고 재사용한다.
    keepalive 16;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;

    root /usr/share/nginx/html;
    index index.html;

    # 26MB 규모의 MediaPipe WASM 및 모델(.task), JS/CSS 번들 전송 크기를 줄이기 위해 gzip 압축 활성화
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm;
    gzip_min_length 1024;

    # ML 담당(PR #6)이 추가한 셀프 호스팅 MediaPipe 자산(/mediapipe/*.wasm, *.task)과 정적 번들(/assets/)은
    # 파일이 없을 때 index.html(200 OK)로 폴백되면 브라우저 WASM 파서가 깨지므로 정확한 404를 반환하고 캐싱을 적용합니다.
    location /mediapipe/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 요청한 라우트(/statistics/period, /calibration 등)가 정적 파일이 아니면 /index.html을 내려줘서 React Router가 화면을 그리게 합니다.
    # (aws cloudfront의 spa rewrite와 똑같은 역할)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx는 프록시할 때 기본 값이 http/1.0(connection: close)입니다. 위에서 설정한 keepalive 16이 실제로 작동하려면
    # http/1.1을 쓰고 connection 헤더를 비워줘야 합니다.
    location = /health {
        proxy_pass http://backend_servers/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # backend/ecolephant/__init__.py에 있는 TRUSTED_HOSTS = ["localhost", "127.0.0.1", "[::1]"] 보안 검사를 통과하기 위해,
        # 포트 번호(:8080)를 뺀 원래 호스트명(127.0.0.1)을 백엔드에 전달합니다.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    location /api/ {
        proxy_pass http://backend_servers;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 29s;

        # 무중단 핵심 줄: 요청을 받은 1번 컨테이너가 마침 종료 중이라 에러(error, timeout, 502, 503, 504)를 내면,
        # 사용자 모르게 2번 컨테이너로 최대 2번까지 (tries 2) 다시 보냅니다.
        # non_idempotent: 원래 nginx는 post 요청은 중복 실행될까 봐 재시도하지 않지만,
        # 우리 API는 Idempotency-Key와 seq로 중복방지가 되어있으므로 POST도 안전하게 재시도하도록 허용한 옵션입니다.
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 2;
    }
}
