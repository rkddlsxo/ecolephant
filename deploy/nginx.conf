# 백엔드 컨데이너 2대 명단, 5초 안에 2번 대답 못하면 명단에서 잠시 빼고, 최대 16개의 연결을 열어두고 재사용
upstream backend_servers {
    server backend:5000 max_fails=2 fail_timeout=5s;
    keepalive 16;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;

    root /usr/share/nginx/html;
    index index.html;
    # ML담당이 만든 ai파일과 화면 코드를 gzip으로 압축
    gzip_types text/plain text/css application/json application/javascript application/wasm;
    gzip_min_length 1024;
    location /mediapipe/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # 한 번 다운로드한 ai 파일은 브라우저가 7일 ~1년 동안 내 컴퓨터에 저장해 두고 또 받지 않게 함.
    # 파일이 없으면 정직하게 404를 냄.
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /health {
        proxy_pass http://backend_servers/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    location /api/ {
        proxy_pass http://backend_servers;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 연결할 때 3초, 요청 보낼 때 10초, 백엔드 대답 기다릴 때 최대 29초까지 기다림.
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 29s;

        # 배포중에 꺼지고 있던 1번 백엔드가 에러(502/503)을 내면, 손님 모르게 살아있는 2번 백엔드로 요청을 보내 몰래 토스.
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 2;
    }
}
