# grafana 대시보드 설정 파일

apiVersion: 1

providers:
  - name: EcolephantDashboards
    orgId: 1
    folder: Ecolephant
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

