# Grafana가 켜질 때 deploy/monitoring/dashboards 폴더 안의 JSON 대시보드를 자동으로 불러오게 하는 설정입니다.
apiVersion: 1

providers:
  - name: "ecolephant-dashboards"
    orgId: 1
    folder: "Ecolephant"
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

