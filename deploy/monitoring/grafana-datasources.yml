#grafana 프로비저닝 파일의 버전
apiVersion: 1

datasources:
# proxy 브라우저가 직접 promethus를 찌르지 않고 grafana 서버가 대신 조회(proxy)하게 함.
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    #도커 내부 네트워크의 prometheus 컨테이너 주소
    url: http://prometheus:9090
    #대시보드에서 패널을 만들 때 기본 선택되는 데이터소스로 지정
    isDefault: true
    editable: false

# 두번째 데이터 소스 loki
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    # 도커 내부 네트워크 loki컨테이너를 자동으로 연결해 explore탭에서 바로 json로그를 검색할 수 있게 해준다.
    url: http://loki:3100
    isDefault: false
    editable: false
